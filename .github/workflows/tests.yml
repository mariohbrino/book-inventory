name: Node Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  FORCE_COLOR: true

jobs:
  tests:
    name: Node Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ["22.22.0"]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install node dependencies
        run: npm ci
      - name: Run all tests
        run: npm run test
